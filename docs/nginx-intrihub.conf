# ==============================================================================
# IntriHub Production Nginx Reverse Proxy & Security Configuration
# Place in: /etc/nginx/sites-available/intrihub.conf
# Enable: ln -s /etc/nginx/sites-available/intrihub.conf /etc/nginx/sites-enabled/
# Test: sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

# 1. Rate Limiting Zones (Nginx Level 1 Defense)
# Limits authentication & OTP requests to 5 requests/minute per client IP
limit_req_zone $binary_remote_addr zone=intrihub_auth_limit:10m rate=5r/m;
# General API protection (60 requests/minute per IP)
limit_req_zone $binary_remote_addr zone=intrihub_api_limit:10m rate=60r/m;

# 2. Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name intrihub.com www.intrihub.com;

    # Let's Encrypt ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 3. HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name intrihub.com www.intrihub.com;

    # SSL Certificates (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/intrihub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/intrihub.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/intrihub.com/chain.pem;

    # Strong SSL Protocols & Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Max upload size (for product & KYC image uploads)
    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 4. Strict Rate Limiting on Auth & OTP Endpoints
    location ~* ^/api/(auth|mobile/auth)/(send-otp|login|signup) {
        limit_req zone=intrihub_auth_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. General API Endpoints
    location /api/ {
        limit_req zone=intrihub_api_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 6. WebSocket Server (Socket.IO on Port 4000)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 7. Next.js Static Cache Optimization
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
    }

    # 8. Main Web App Proxy
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
